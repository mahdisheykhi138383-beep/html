<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box-sizing</title>
    <style>
        *{
            /* box-sizing: border-box; */
        }
        .box{
            width: 500px;
            height: 500px;
            background-color: blue;
            border: 50px solid red;
            padding: 25px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box">hello everybody</div>
</body>
</html>
