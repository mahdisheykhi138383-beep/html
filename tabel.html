<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel</title>
</head>
<body>
    <table style="border: 1px solid black;">
        <tr>
            <td style="border: 1px solid black;" colspan="3">11</td>
            
        </tr>
        <tr>
            <td style="border: 1px solid black;" colspan="2">21</td>
            <td style="border: 1px solid black;" rowspan="2">22</td>
        </tr>
        <tr>
            <td style="border: 1px solid black;"colspan2>222</td>
        </tr>
        <tr>
            <td style="border: 1px solid black;" colspan="3">33</td>
        </tr>
    </table>
</body>
</html>
