<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body dir="rtl">
    <fieldset>
        <legend>فرم اتاق عمل</legend>
    <form action="" width="300px">


        <table border="1" align="center" width="300px">
            <tr>
                <td width="100px"><label>نام :</label></td>
                <td><input type="text" maxlength="20" size="15" placeholder="joj" required></td>
            </tr>

            <tr>
                <td width="100px"><label for="">نام کاربری :</label></td>
                <td><input type="text" maxlength="20" size="15" placeholder="joj" required></td>
            </tr>

            <tr>
                <td width="100px"><label for="">رمز :</label></td>
                <td><input type="password" maxlength="20" size="15" placeholder="joj" required></td>
            </tr>

            <tr>
                <td width="100px"><label for="">ایمیل :</label></td>
                <td><input type="email" size="15" placeholder="joj"></td>
            </tr>

            <tr>
                <td width="100px"><label for="">ادرس :</label></td>
                <td><textarea name="" id="" required></textarea></td>
            </tr>

            <tr>
                <td width="100px"><label for="">جنسیت :</label></td>
                <td><input type="radio" name="sex">مرد
                    <input type="radio" name="sex">زن
                    <input type="radio" name="sex">هیچکدام
                </td>
            </tr>

            <tr>
                <td width="100px"><label for="">نام شهر :</label></td>
                <td><select name="" id="" required>
                    <option value="a" selected>تهران</option>
                    <option value="a">شیراز</option>
                </select></td>
            </tr>

            <tr>
                <td width="100px"><label for="">نام استان :</label></td>
                <td><select name="" id="" required>
                    <optgroup label="شرق">
                        <option value="a">تهران</option>
                        <option value="a">شیراز</option>
                    </optgroup>
                    
                    <optgroup label="غرب">
                        <option value="">مشهد</option>
                        <option value="">مازندران</option>
                        <option value="">کشمیران</option>
                    </optgroup>
                </select></td>
            </tr>

            <tr>
                <td width="100px"><label for="">علایق :</label></td>
                <td>
                    <input type="checkbox">ورزش
                    <input type="checkbox">الکل
                    <input type="checkbox">سیگار
                    <input type="checkbox">کتاب
    </td>
            </tr>
            <tr>
                <td colspan="2" align="center" width="150"><input type="submit" value="ارسال"></td>
            </tr>
            <tr>
                <td colspan="2" align="center" width="150"><input type="reset" value="ریست"></td>
            </tr>
        </table>







    </form>
    </fieldset>

</body>
</html>
