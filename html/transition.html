<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transition</title>
    <style>
        .box{
            width: 500px;
            height: 500px;
            margin: 50px;
            background-color: blue;
            /* transition-duration: 1s; */
            /* transition-property: all; */
            /* transition-delay: 0.5s; */
            /* transition */
            transition: all ease 1s 0.5s;
        }
        .box:hover{
            transform: translateY(-150px);
            opacity: 0;
        }
        .body{
           background: linear-gradient(rgba(0, 0, 0, 0.121),rgba(0, 0, 0, 0.882)) url(/pictures/c2.jpeg);
           transition: all ease 1s;

        }
        }
    </style>
</head>
<body>
    <div class="body">
        <div class="box"></div>
    </div>

   
</body>
</html>
