<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>overlay</title>
    <style>
        .box{
            width: 400px;
            height: 400px;
            background: url(/pictures/c2.jpeg);
        }
        .overlay{
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.121),rgba(0, 0, 0, 0.882));
            opacity: 0;
            transition: all ease 1s;
            position: relative;
        }
        .overlay:hover{
            opacity: 1;
        }
        .left{
            width: 50%;
            height: 50%;
            border: 5px solid red;
            position: absolute;
            bottom: 20px;
            left: 20px;
            border-top: none;
            border-right: none;
        }
        .right{
            width: 50%;
            height: 50%;
            border: 5px solid red;
            position: absolute;
            top: 20px;
            right: 20px;
            border-bottom: none;
            border-left: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="overlay">
            <div class="left"></div>
            <div class="right"></div>
        </div>
    </div>
</body>
</html>
