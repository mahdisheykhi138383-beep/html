<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inline-block</title>
    <style>
        p{
            border: 1px solid ;
            width: 300px;
            margin: 0 auto;


        }
        a{
            border: 1px solid ;
            width: 300px;
            display: inline-block;



        }
        div{
            text-align: center;
        }
    </style>
</head>
<body>
    <p>Lorem ipsum dolor sita, ea doloribus sunt mollitia solutt sunt!</p>
    <hr>
    <div>
        <a href="">Lorem, ipsum dolor.</a>
    </div>
</body>
</html>
